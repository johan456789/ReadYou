name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# ci-templates was refactored: android-gradle-app.yml -> app-android.yml.
# Referencing @main until the template repo cuts a v1 tag; switch to @v1 then.
jobs:
  android:
    uses: johan456789/ci-templates/.github/workflows/app-android.yml@main
    with:
      # Build only the github flavor so a single, installable APK is produced.
      # Qualified with :app: because ReadYou's app is a subproject (root has no Android tasks).
      gradle_task: :app:assembleGithubRelease
      # ReadYou reads release signing from signature/keystore_release.properties
      properties_file: signature/keystore_release.properties
      keystore_file: signature/upload-keystore.jks
    secrets: inherit
